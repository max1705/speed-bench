# speed-bench (Python)

Консольный скрипт на Python для замера скорости скачивания указанного URL.

Зависимости: только стандартная библиотека + `certifi`.
Требуется Python **3.9+** (используются аннотации `list[float]`).

## Установка

1. Установка certifi (свежий набор корневых CA-сертификатов):

   python  -m pip install --upgrade certifi

   Зачем: без него на многих системах Python ругается
   `CERTIFICATE_VERIFY_FAILED: certificate has expired`.

## Запуск

python  bench.py <URL>

## Что делает скрипт

1. Принимает URL из первого аргумента командной строки.
2. Делает 10 последовательных запросов GET.
3. На каждый запрос:
   - засекает время до открытия соединения (в замер входят DNS,
     TCP, TLS-хендшейк и чтение тела);
   - дожидается полного ответа;
   - считает реально прочитанные байты.
4. Между запросами делает паузу 1 секунда (кроме последнего) -
   чтобы не ловить `HTTP 429 Too many requests` на сайтах с защитой
   от ботов.
5. После 10 запросов печатает:
   - среднее время запроса;
   - суммарный объём и средний размер ответа;
   - среднюю скорость (по среднему запросу) и общую скорость (весь объём / всё время).

При первой же ошибке (HTTP 4xx/5xx, таймаут, SSL) скрипт останавливается и печатает `[NN] ОШИБКА: ...` с кодом возврата `2`.

## Пример вывода

```
URL: [URL]
Запросов: 10

[ 1]   8.412 c |    100.00 MB |   11.885 МБ/с
[ 2]   8.103 c |    100.00 MB |   12.341 МБ/с
[ 3]   8.271 c |    100.00 MB |   12.090 МБ/с
...
--- ИТОГИ ---
Среднее время запроса : 8.251 c
Всего скачано        : 1000.00 MB
Средний размер ответа: 100.00 MB
Средняя скорость     : 12.119 МБ/с (по среднему запросу)
Общая скорость       : 12.119 МБ/с (весь объём / всё время)
```

## Коды возврата

| Код | Значение                                                     |
|-----|--------------------------------------------------------------|
| `0` | Успех — все 10 запросов выполнены                            |
| `1` | Не передан URL                                               |
| `2` | Ошибка запроса: HTTP 4xx/5xx, таймаут, SSL и т.п.            |
